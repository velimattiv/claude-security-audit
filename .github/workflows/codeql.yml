# CodeQL analysis for this repo.
#
# The skill's documentation says CodeQL is excluded BY DEFAULT for
# audits because CodeQL's CLI is license-restricted to OSI-approved
# open source. This repo IS MIT-licensed, so CodeQL is fine for our
# own CI.

name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'   # Monday 06:00 UTC weekly

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        language: [python]
        # Only Python (scripts/*.py, skills/security-audit/lib/*.py) and shell
        # scripts (not CodeQL-supported) carry real logic.
        #
        # Do NOT add 'javascript-typescript' without a paths-ignore for
        # tests/fixtures/**: those .ts files are DELIBERATELY vulnerable
        # reproductions (unscoped collection queries, ungated byte sinks) used
        # as regression fixtures. Scanning them would produce a permanent wall
        # of true-positive alerts against code that is supposed to be broken,
        # and an alert list nobody can clear is an alert list nobody reads.

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28  # v4.37.8
        with:
          languages: ${{ matrix.language }}
          queries: security-extended,security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v4.37.3
        with:
          category: "/language:${{ matrix.language }}"
