# CI for the /security-audit skill itself — not for projects that use it.
# Runs the repo-wide validation suite on push + PR. Catches schema drift,
# broken cross-references, stale version pins, and script syntax errors
# before they ship.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"

      - name: Install validator dependencies
        run: |
          pip install -r requirements-ci.txt

      - name: Install jq
        run: |
          # jq is pre-installed on ubuntu-latest, but be explicit
          sudo apt-get update && sudo apt-get install -y --no-install-recommends jq

      - name: Run validation suite
        run: |
          scripts/validate-schemas.sh

      - name: Validate findings fixtures (with CWE-in-map check)
        run: |
          for fixture in tests/fixtures/*.jsonl; do
            [ -f "$fixture" ] || continue
            python3 scripts/validate-findings.py \
              --schema skills/security-audit/lib/finding-schema.json \
              --cwe-map skills/security-audit/lib/cwe-map.json \
              "$fixture"
          done

      - name: Collection-scoping + partition-coverage gates (v2.5)
        run: |
          # The tree-bug fixture reproduces the handler that passed a full v2.4
          # audit with a clean bill. It must be caught with no operator hint,
          # with zero false positives on the correctly-scoped and public
          # endpoints, and an omitted collection must fail the gate fail-closed.
          bash tests/test-collection-scoping.sh

      - name: Attack-path severity gate (v2.5)
        run: |
          # Severity computed over composed attack paths (R1-R3), the no-silent-
          # downgrade ratchet (R4), and the finding-lifecycle gates (L1-L3) that
          # close the found-but-never-fixed hole.
          bash tests/test-attack-paths.sh

      - name: Installed-skill path integrity (v2.5)
        run: |
          # Installation copies ONLY skills/security-audit/. Any $SKILL_DIR/<x>
          # path referenced by a step file must therefore exist inside that
          # directory. v2.4 shipped phase-06 invoking
          # $SKILL_DIR/scripts/validate-egress.py, which never exists in a real
          # install — the flagship control could not run. This check makes that
          # class of regression impossible to ship again.
          missing=0
          while read -r ref; do
            [ -n "$ref" ] || continue
            if [ ! -e "skills/security-audit/$ref" ]; then
              echo "::error::steps/*.md references \$SKILL_DIR/$ref which does not exist in the shipped skill directory"
              missing=$((missing + 1))
            fi
          done < <(grep -rhoE '\$SKILL_DIR/[A-Za-z0-9_./-]+' skills/security-audit \
                    | sed 's|^\$SKILL_DIR/||' | sort -u)
          if [ "$missing" -gt 0 ]; then
            echo "$missing unresolvable \$SKILL_DIR path(s)."
            exit 1
          fi
          echo "All \$SKILL_DIR references resolve inside the shipped skill."

      - name: Authorized-Egress reconciliation (deterministic + metamorphic battery)
        run: |
          # Deck-bug caught (R3/R4/R5 + CRITICAL), coverage gate fails-closed on
          # an omitted sink, extractor recall across modalities, and every
          # metamorphic mutant (gate-moved, conditional-bypass, resource-rename,
          # sink-kind-swap) is still caught.
          bash tests/test-egress.sh

      - name: Evidence discipline (v2.6)
        run: |
          # The Wave-3 obligations enforced mechanically rather than in prose:
          # HIGH+ findings must enumerate their sibling sites (the majority of
          # the 34 defects a calibrated triage found and the audit missed were
          # the 2nd/3rd/4th site of a defect found once), a refutation must be
          # scoped to what was actually examined (a refutation true of one
          # module, generalised to a system property, buried a live HIGH), a
          # suggested fix must be rated separately from its finding, and an
          # unreachability claim that suppresses escalation must cite a line.
          bash tests/test-evidence-discipline.sh

      - name: Secret redaction + deliverable gate (v2.6.1)
        run: |
          # v2.6.0 and earlier copied gitleaks' verbatim `region.snippet.text`
          # into findings.sarif and then into a TRACKED <output_dir>, so the
          # audit committed live credentials the audited repo had correctly
          # kept out of git. This suite pins both enforcers: the structural
          # strip at Phase 4 ingest and the fail-closed write gate at Phases
          # 7-8 -- plus the assertion that the step files actually invoke
          # them, which is the control-with-no-enforcer check.
          bash tests/test-secret-redaction.sh

      - name: Compile-check cat-*.md regex patterns (polyglot regression guard)
        run: |
          python3 scripts/validate-patterns.py

      - name: Lint shell scripts
        run: |
          for f in scripts/*.sh tests/*.sh; do
            [ -f "$f" ] || continue
            bash -n "$f"
          done

      - name: Validate install-snippet version pins
        run: |
          scripts/validate-install-pins.sh

      - name: Summary
        if: always()
        run: |
          echo "::notice::Validation suite complete."
          echo "This CI runs repo-level validation only. To audit your PROJECT"
          echo "with /security-audit, see docs/ci-examples/github-actions/security-audit.yml"
